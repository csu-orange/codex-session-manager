name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag version ($TAG) does not match Cargo.toml version ($VERSION)."
            exit 1
          fi

      - name: Verify tag matches Tauri config version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep '"version":' src-tauri/tauri.conf.json | head -n1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag version ($TAG) does not match tauri.conf.json version ($VERSION)."
            exit 1
          fi

  publish-windows-portable:
    needs: validate-version
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        shell: powershell
        run: cargo install tauri-cli --version "^2.0" --locked
      
      - name: Add Cargo bin to PATH
        shell: powershell
        run: |
          "$env:CARGO_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Tauri CLI
        shell: powershell
        run: cargo tauri --version

      - name: Build portable Windows executable
        shell: powershell
        run: |
          cargo tauri build --no-bundle
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item `
            -LiteralPath "src-tauri\target\release\codex-session-manager.exe" `
            -Destination "dist\codex-session-manager_${{ github.ref_name }}_windows_x64_portable.exe" `
            -Force

      - name: Publish portable Windows executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Codex Session Manager ${{ github.ref_name }}
          body: Portable Windows release for Codex Session Manager.
          draft: false
          prerelease: false
          files: dist/codex-session-manager_${{ github.ref_name }}_windows_x64_portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

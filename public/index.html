<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Session Manager</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1>Codex Session Manager</h1>
          <p class="subtitle">跨 provider 查看和管理本机 Codex 会话</p>
        </div>
        <div class="actions">
          <button id="refreshButton" class="button secondary" type="button">刷新</button>
          <button id="archiveSelectedButton" class="button secondary" type="button" disabled>归档选中</button>
          <button id="restoreSelectedButton" class="button secondary" type="button" disabled>恢复选中</button>
          <button id="deleteSelectedButton" class="button danger" type="button" disabled>删除选中</button>
        </div>
      </header>

      <section class="cards">
        <div class="card">
          <div class="label">当前 provider</div>
          <div id="currentProvider" class="value">-</div>
        </div>
        <div class="card">
          <div class="label">当前 model</div>
          <div id="currentModel" class="value">-</div>
        </div>
        <div class="card">
          <div class="label">会话总数</div>
          <div id="totalSessions" class="value">0</div>
        </div>
        <div class="card">
          <div class="label">已选会话</div>
          <div id="selectedCount" class="value">0</div>
        </div>
      </section>

      <section class="filters panel">
        <div class="field wide">
          <label for="searchInput">搜索</label>
          <input id="searchInput" type="search" placeholder="按 provider、目录、首条消息、最后一条消息搜索">
        </div>
        <div class="field">
          <label for="locationFilter">状态</label>
          <select id="locationFilter">
            <option value="">全部</option>
            <option value="active">活动</option>
            <option value="archived">归档</option>
          </select>
        </div>
        <div class="field">
          <label for="providerFilter">Provider</label>
          <select id="providerFilter">
            <option value="">全部</option>
          </select>
        </div>
        <div class="field">
          <label for="sourceFilter">Source</label>
          <select id="sourceFilter">
            <option value="">全部</option>
          </select>
        </div>
        <div class="field wide">
          <label for="cwdFilter">目录包含</label>
          <input id="cwdFilter" type="text" placeholder="例如 code\\codex">
        </div>
      </section>

      <section class="provider-strip panel">
        <div class="section-title">Provider 分布</div>
        <div id="providerSummary" class="chips"></div>
      </section>

      <main class="layout">
        <section class="panel table-panel">
          <div class="section-title">全部会话</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="checkbox-cell"><input id="selectAllCheckbox" type="checkbox" aria-label="全选"></th>
                  <th>时间</th>
                  <th>Provider</th>
                  <th>状态</th>
                  <th>Source</th>
                  <th>目录</th>
                  <th>首条用户消息</th>
                  <th>最后一条用户消息</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="sessionsTableBody"></tbody>
            </table>
          </div>
        </section>

        <aside class="panel detail-panel">
          <div class="section-title">会话详情</div>
          <div id="detailEmpty" class="empty-state">选择一条会话查看详情</div>
          <div id="detailContent" class="detail-content hidden">
            <div class="detail-grid">
              <div><span class="detail-label">ID</span><code id="detailId"></code></div>
              <div><span class="detail-label">Provider</span><span id="detailProvider"></span></div>
              <div><span class="detail-label">时间</span><span id="detailTimestamp"></span></div>
              <div><span class="detail-label">Source</span><span id="detailSource"></span></div>
              <div><span class="detail-label">目录</span><span id="detailCwd"></span></div>
              <div><span class="detail-label">文件</span><span id="detailFile"></span></div>
              <div><span class="detail-label">用户消息数</span><span id="detailUserTurns"></span></div>
              <div><span class="detail-label">助手消息数</span><span id="detailAssistantTurns"></span></div>
            </div>

            <div class="detail-block">
              <div class="detail-label">用户消息</div>
              <ol id="detailMessages" class="message-list"></ol>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
  </html>
